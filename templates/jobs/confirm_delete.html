{% extends "base.html" %}
{% block title %}Delete {{ type }}{% endblock %}
{% block page_title %}Delete {{ type }}{% endblock %}

{% block content %}
<div class="card-panel" style="max-width: 500px;">
  <div class="alert alert-danger">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    Are you sure you want to delete <strong>{{ object }}</strong>?
    This action cannot be undone.
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Yes, Delete</button>
      <a href="{% url back_url %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
